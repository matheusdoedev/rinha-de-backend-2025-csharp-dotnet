worker_processes auto;

events {
	worker_connections 1024;
}

http {
	include mime.types;
	default_type application/octet-stream;
	sendfile on;
	keepalive_timeout 65;
	client_max_body_size 100M;

	upstream api {
		least_conn;
		server localhost:8081;
		server localhost:8082;
	}

	server {
		listen 9999;
		server_name localhost;

		location / {
			proxy_pass http://api;
		}
	}
}