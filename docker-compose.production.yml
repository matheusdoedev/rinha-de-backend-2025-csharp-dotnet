x-service-templates:
  rinha-api: &rinha-api
    image: matheusdoe/rinha-backend:latest
    networks:
      - payment-processor
      - payment-processor-db
    deploy:
      restart_policy:
        condition: on-failure
        delay: 2s
        max_attempts: 10
        window: 5s
      resources:
        limits:
          cpus: "0.15"
          memory: "42MB"

  payment-processor: &payment-processor
    image: zanfranceschi/payment-processor:amd64-20250807222453
    networks:
      - payment-processor
      - payment-processor-db
    deploy:
      restart_policy:
        condition: on-failure
        delay: 2s
        max_attempts: 10
        window: 5s
      resources:
        limits:
          cpus: "1.5"
          memory: "100MB"

  payment-processor-db: &payment-processor-db
    image: postgres:17-alpine
    command: postgres -c checkpoint_timeout=600 -c max_wal_size=4096 -c synchronous_commit=0 -c fsync=0 -c full_page_writes=0
    networks:
      - payment-processor-db
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=rinha
    deploy:
      restart_policy:
        condition: on-failure
        delay: 2s
        max_attempts: 10
        window: 5s
      resources:
        limits:
          cpus: "1.5"
          memory: "250MB"

services:
  rinha-api-1:
    <<: *rinha-api
    container_name: rinha-api-1
    volumes:
      - ./.env:/App/.env
    ports:
      - "8081:8080"
    networks:
      - payment-processor
    depends_on:
      - rinha-db
      - broker
      - payment-processor-1
      - payment-processor-2

  rinha-api-2:
    <<: *rinha-api
    container_name: rinha-api-2
    volumes:
      - ./.env:/App/.env
    ports:
      - "8082:8080"
    networks:
      - payment-processor
    depends_on:
      - rinha-db
      - broker
      - payment-processor-1
      - payment-processor-2

  rinha-db:
    container_name: "rinha-db"
    image: postgres
    restart: always
    environment:
      - "POSTGRES_USER=docker"
      - "POSTGRES_PASSWORD=docker"
      - "POSTGRES_DB=docker"
    volumes:
      - ./init-rinha-db.sql:/docker-entrypoint-initdb.d/init.sql
      - rinha-db:/var/lib/postgresql/data
    ports:
      - "16000:5432"
    networks:
      - payment-processor

  broker:
    container_name: "rinha-broker"
    image: rabbitmq:management
    environment:
      - "RABBITMQ_DEFAULT_USER=admin"
      - "RABBITMQ_DEFAULT_PASS=admin@123"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - broker:/var/run/postgresql
    networks:
      - payment-processor

  payment-processor-1:
    <<: *payment-processor
    container_name: payment-processor-default
    hostname: payment-processor-default
    environment:
      - TRANSACTION_FEE=0.05
      - RATE_LIMIT_SECONDS=5
      - INITIAL_TOKEN=123
      - DB_CONNECTION_STRING=Host=/var/run/postgresql;Port=5432;Database=rinha;Username=postgres;Password=postgres;Minimum Pool Size=15;Maximum Pool Size=20;Connection Pruning Interval=3
    ports:
      - 8001:8080
    volumes:
      - postgres-socket-01:/var/run/postgresql
    depends_on:
      - payment-processor-db-1

  payment-processor-db-1:
    <<: *payment-processor-db
    container_name: payment-processor-default-db
    hostname: payment-processor-default-db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-socket-01:/var/run/postgresql

  payment-processor-2:
    <<: *payment-processor
    container_name: payment-processor-fallback
    hostname: payment-processor-fallback
    environment:
      - TRANSACTION_FEE=0.15
      - RATE_LIMIT_SECONDS=5
      - INITIAL_TOKEN=123
      - DB_CONNECTION_STRING=Host=/var/run/postgresql;Port=5432;Database=rinha;Username=postgres;Password=postgres;Minimum Pool Size=15;Maximum Pool Size=20;Connection Pruning Interval=3
    ports:
      - 8002:8080
    volumes:
      - postgres-socket-02:/var/run/postgresql
    depends_on:
      - payment-processor-db-2

  payment-processor-db-2:
    <<: *payment-processor-db
    container_name: payment-processor-fallback-db
    hostname: payment-processor-fallback-db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-socket-02:/var/run/postgresql

networks:
  payment-processor:
    name: payment-processor
    driver: bridge
  payment-processor-db:
    driver: bridge

volumes:
  rinha-db:
  broker:
  postgres-socket-01:
  postgres-socket-02:
