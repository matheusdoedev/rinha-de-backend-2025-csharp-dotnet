version: "3"

services:
  db:
    image: docker.io/postgres:latest
    restart: always
    environment:
      - POSTGRES_USER=docker
      - POSTGRESS_PASSWORD=docker
      - POSTGRES_DB=docker
    ports:
      - "5432:5432"
    networks:
      - default

  broker:
    image: rabbitmq:management
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin@123
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - default

networks:
  defaukt:
    driver: bridge
